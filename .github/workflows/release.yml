name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build module
        run: ./scripts/build.sh

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/303-module.tar.gz
          generate_release_notes: true

      - name: Update release.json on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          VERSION="${{ steps.version.outputs.version }}"

          # name and description are DERIVED from src/module.json, which is
          # where they are actually maintained. They used to be hardcoded in
          # this heredoc, and drifted: the description here still advertised
          # the GuitarML overdrive months after it was replaced, and that
          # string is what the Module Store shows.
          #
          # Any other field already in release.json (install_path, requires,
          # download_url_core, ...) is preserved -- this step owns only the
          # five keys it writes.
          REPO="${{ github.repository }}" \
          python3 - "$VERSION" <<'PY'
          import json, os, sys

          version = sys.argv[1]
          repo = os.environ["REPO"]

          with open("src/module.json") as f:
              mod = json.load(f)

          try:
              with open("release.json") as f:
                  rel = json.load(f)
          except (OSError, ValueError):
              rel = {}

          rel["version"] = version
          rel["download_url"] = (
              f"https://github.com/{repo}/releases/download/v{version}/303-module.tar.gz"
          )
          rel["name"] = mod["name"]
          rel["description"] = mod["description"]
          rel["repo_url"] = f"https://github.com/{repo}"

          with open("release.json", "w") as f:
              json.dump(rel, f, indent=4)
              f.write("\n")
          PY

          git add release.json
          git diff --cached --quiet && exit 0
          git commit -m "release: v${VERSION}"
          git push origin main
